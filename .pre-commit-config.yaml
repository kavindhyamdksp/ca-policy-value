repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
        exclude: ^validation/
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, src)
        entry: mypy src
        language: system
        pass_filenames: false
        types: [python]
      - id: ledger-validate
        name: ledger validate
        entry: pv validate
        language: system
        pass_filenames: false
        files: ^ledger/
