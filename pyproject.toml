[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "policyvalue-ca"
version = "0.2.1"
description = "Realized policy value for Canadian industrial decarbonization projects: a cited policy ledger plus a deterministic valuation kernel."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PolicyValue CA contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "Jinja2>=3.1",
  "markdown-it-py>=3.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
pv = "pv.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pv"]

[tool.hatch.build.targets.wheel.force-include]
"ledger" = "pv/_ledger"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["validation"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"  # numpy>=2.3 stubs use PEP 695 syntax
files = ["src", "tools"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: long-running (MC, performance)"]

[tool.coverage.run]
source = ["pv"]
omit = ["*/pv/cli.py", "*/pv/report.py"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059", "RUF043", "E501"]
