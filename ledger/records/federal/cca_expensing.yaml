  notes: Classes eligible for the fed.cca.expensing first-year deduction (property acquired on or after
    2025-01-01). `eligible` follows the fed.cca.expensing phase-out; a number is a first-year fraction that
    holds for every year the series is positive. Class 53 = 1.0 because its A.1 factor is 1 in every year at a
    50% rate (0.50 x 2); Class 53 itself only takes property acquired before 2026. Class 43.2 is not listed in
    A.1 of Reg. 1100(2) and takes property acquired before 2025 only, so it is not listed; a class absent from
    this table gets normal declining-balance CCA. Primary text fetched 2026-10-06.
