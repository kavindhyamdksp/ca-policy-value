  notes: Value is the whole first-year deduction as a fraction of cost, keyed by available-for-use year, for
    reaccelerated investment incentive property (acquired after 2024, available for use before 2034). Derived
    from Reg. 1100(2) as class rate x (1 + A.1 factor), with no half-year reduction because element C excludes
    this property. Class 43.1 at 30% gives 0.30 x (1 + 7/3) = 1.00 before 2030, 0.30 x 2.5 = 0.75 in 2030-2031,
    0.30 x (1 + 5/6) = 0.55 in 2032-2033 (the same fractions follow for Class 43 M&P property, Class 54/56 at
    30% and Class 55 at 40%). Class 53 has a flat A.1 factor of 1 (see fed.cca.expensing_classes). 2034 = 0.0
    means no enhanced deduction (normal CCA with the half-year rule). Regulations current to 2026-09-21, last
    amended 2026-06-18. C-15 received Royal Assent on 2026-03-26 (Finance release).
