name: ledger-links

on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 'ledger/records/**/*.yaml'
          fail: false   # non-blocking (plan §5.4)
